name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: swab
          POSTGRES_PASSWORD: swab_ci
          POSTGRES_DB: swab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U swab -d swab_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Agent renders in sync (agents/ is the source of truth)
        run: node scripts/render-agents.mjs --check
      - run: pnpm install --frozen-lockfile
      - name: Apply DB migrations to the CI Postgres service
        # Migrations now exist (packages/db/prisma/migrations/20260719000000_init,
        # SUG-DB-002) — deploy them, don't `db push` (that command is dev-loop only
        # and never touches migration history; see SUG-OPS-013 deviation note).
        run: pnpm --filter @repo/db exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://swab:swab_ci@localhost:5432/swab_test
      - run: pnpm turbo run lint typecheck test build
        env:
          DATABASE_URL: postgresql://swab:swab_ci@localhost:5432/swab_test
