name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel an in-progress run on main: two quick merges back-to-back would
  # otherwise leave the first merge commit with no completed CI (bad for bisecting
  # and for anything future that keys off main being green). PR branches still
  # cancel superseded runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    # Cheap path filter (no third-party action — see SUG-OPS-001 deviation note in
    # root CHANGELOG.md) so native jobs only run when their platform's files changed.
    # macOS runners bill at a 10x minute multiplier; this keeps that cost bounded.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.diff.outputs.android }}
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Determine changed platforms
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
          else
            # workflow_dispatch or a base we can't diff against (e.g. first push,
            # force-push): fail open and run both native suites.
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          echo "$CHANGED" | grep -q '^apps/android/' && echo "android=true" >> "$GITHUB_OUTPUT" || echo "android=false" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" | grep -q '^apps/ios/' && echo "ios=true" >> "$GITHUB_OUTPUT" || echo "ios=false" >> "$GITHUB_OUTPUT"

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: swab
          POSTGRES_PASSWORD: swab_ci
          POSTGRES_DB: swab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U swab -d swab_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: actionlint
        # Zero-third-party-action alternative (no new action pin to maintain):
        # docker is preinstalled on GitHub-hosted ubuntu runners.
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Agent renders in sync (agents/ is the source of truth)
        run: node scripts/render-agents.mjs --check
      - name: Design tokens in sync (packages/ui/tokens/tokens.json is the source of truth)
        run: node packages/ui/scripts/generate.mjs --check
      - name: Portability lint unit tests (matcher function)
        run: node --test scripts/portability-lint.test.mjs
      - name: Portability lint (no Vercel APIs, no Neon-specific code — G4)
        run: node scripts/portability-lint.mjs
      - name: Docs hygiene unit tests (entry/line budget functions)
        run: node --test scripts/docs-hygiene-lint.test.mjs
      - name: Docs hygiene lint (G5 changelog + STATUS.md budgets)
        run: node scripts/docs-hygiene-lint.mjs
      - run: pnpm install --frozen-lockfile
      - name: Prisma schema valid
        run: pnpm --filter @repo/db db:validate
        env:
          DATABASE_URL: postgresql://swab:swab_ci@localhost:5432/swab_test
      - name: Turborepo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Apply DB migrations to the CI Postgres service
        # Migrations now exist (packages/db/prisma/migrations/20260719000000_init,
        # SUG-DB-002) — deploy them, don't `db push` (that command is dev-loop only
        # and never touches migration history; see SUG-OPS-013 deviation note).
        run: pnpm --filter @repo/db exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://swab:swab_ci@localhost:5432/swab_test
      - run: pnpm turbo run lint typecheck test build --cache-dir=.turbo/cache --summarize
        env:
          DATABASE_URL: postgresql://swab:swab_ci@localhost:5432/swab_test
      - name: Cache stats to summary
        if: always()
        run: |
          {
            echo "## CI summary"
            echo "- ref: ${GITHUB_REF}"
            echo "- event: ${GITHUB_EVENT_NAME}"
            SUMMARY_FILE=$(find .turbo/runs -maxdepth 1 -name '*.json' -print -quit 2>/dev/null || true)
            if [ -n "$SUMMARY_FILE" ]; then
              node -e "
                const s = require('./$SUMMARY_FILE');
                const total = s.execution.attempted;
                const hits = s.tasks.filter(t => t.cache.status === 'HIT').length;
                console.log(\`- turbo cache: \${hits}/\${total} tasks hit\`);
              " >> "$GITHUB_STEP_SUMMARY" || echo "- turbo cache: summary unavailable" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- turbo cache: no run summary found" >> "$GITHUB_STEP_SUMMARY"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  android-unit:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Android unit tests
        run: ./gradlew test --stacktrace
        working-directory: apps/android

  ios-unit:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: iOS SwiftPM unit tests
        run: xcrun swift test
        working-directory: apps/ios
