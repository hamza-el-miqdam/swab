name: scope-guard

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: scope-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Issue #65: default pull_request behavior checks out
          # refs/pull/N/merge — the PR head merged with the base branch's
          # CURRENT tip, not what it was when the PR opened. That makes
          # base.sha...HEAD (below) include every commit merged to main
          # since, wrongly blaming the PR for files it never touched (or,
          # for the escaping check, wrongly widening its apparent scope).
          # Checking out the PR's own head commit directly makes base.sha
          # the correct three-dot merge-base again. Falls back to the
          # triggering ref for non-PR events (workflow_dispatch).
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: Unit tests (path-matching logic)
        run: node --test scripts/scope-guard.test.mjs

      - name: Check diff against area scope
        if: github.event_name == 'pull_request'
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/scope-guard.mjs

      - name: Job summary
        if: always()
        run: |
          {
            echo "## scope-guard summary"
            echo "- event: ${{ github.event_name }}"
            echo "- labels: ${{ join(github.event.pull_request.labels.*.name, ', ') || '(none — workflow_dispatch run)' }}"
          } >> "$GITHUB_STEP_SUMMARY"
