name: scope-guard

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: scope-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Unit tests (path-matching logic)
        run: node --test scripts/scope-guard.test.mjs

      - name: Check diff against area scope
        if: github.event_name == 'pull_request'
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/scope-guard.mjs

      - name: Job summary
        if: always()
        run: |
          {
            echo "## scope-guard summary"
            echo "- event: ${{ github.event_name }}"
            echo "- labels: ${{ join(github.event.pull_request.labels.*.name, ', ') || '(none — workflow_dispatch run)' }}"
          } >> "$GITHUB_STEP_SUMMARY"
