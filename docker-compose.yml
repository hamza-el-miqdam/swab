# Swab — local development stack: Postgres 17 + the API.
# The mobile app runs on your machine/simulator and points at this API.
#
# Vanilla postgres:17 on purpose (portability guardrail §8.2): the app must
# never depend on anything Neon-specific, and this stack proves it daily.
#
# Secrets note (G1): the credentials below are LOCAL-ONLY defaults for a
# database that lives inside Docker on your machine. Real environments use
# GitHub/Vercel secrets — never commit real credentials here.
name: swab

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: swab
      POSTGRES_PASSWORD: swab_local_dev
      POSTGRES_DB: swab
    ports:
      # Loopback-only (G1): Postgres never needs LAN exposure for this stack.
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swab -d swab"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    environment:
      DATABASE_URL: postgresql://swab:swab_local_dev@db:5432/swab
      JWT_SECRET: local-dev-only-secret-change-me-0000000000
      NODE_ENV: development
      PORT: "3001"
      # Fail-closed (G1): local dev only — must never be "enabled" in production.
      OTP_DEV_CODE: enabled
    ports:
      # Exposed on the LAN deliberately (not loopback-only) so a physical
      # phone can reach the API during on-device testing; simulator/emulator
      # flows use localhost regardless.
      - "3001:3001"
    healthcheck:
      # curl/wget aren't in node:22-slim; Node's global fetch is. Generous
      # retries because first boot includes `prisma migrate deploy`.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    # Dev bootstrap: apply committed migrations (packages/db/prisma/migrations/
    # 20260719000000_init, SUG-DB-002), then start the API. `migrate deploy` (not
    # `db push`) so local dev matches how CI and production apply schema changes.
    # One-time step for anyone with an existing `db push`-created local database:
    # run `pnpm --filter @repo/db exec prisma migrate resolve --applied 20260719000000_init`
    # once before this will apply cleanly (see packages/db/CHANGELOG.md).
    command: ["sh", "-c", "pnpm --filter @repo/db exec prisma migrate deploy && pnpm --filter @repo/api dev"]
    develop:
      watch:
        - action: sync
          path: ./apps/api/src
          target: /app/apps/api/src
        - action: rebuild
          path: ./apps/api/package.json

  # Database UI — Adminer: ~20 MB image, full CRUD, zero config.
  # Chosen over DbGate/pgAdmin for footprint (free-tier laptop ethos).
  # Dev-stack only: never deploy this alongside a real environment (G1).
  adminer:
    image: adminer:5
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: dracula
    ports:
      # Loopback-only (G1): full DB CRUD UI, LAN exposure would let anyone
      # on the same network reach it.
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
